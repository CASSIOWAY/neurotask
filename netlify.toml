# Netlify — site 100% estático (sem build)
[build]
  publish = "."
  command = ""

# Cabeçalhos de cache: HTML sempre fresco, CSS/JS imutáveis
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirecionamento amigável: www -> domínio principal
[[redirects]]
  from = "http://*"
  to = "https://SEU-DOMINIO.com/:splat"
  status = 301
  force = false
